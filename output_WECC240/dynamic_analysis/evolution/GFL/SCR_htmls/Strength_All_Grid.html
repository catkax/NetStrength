<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCR Visualization: dynamic analysis</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f4f8;
            color: #222;
        }

        header {
            padding: 20px 28px;
            background: white;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        header h1 {
            margin: 0;
            font-size: 1.35rem;
            letter-spacing: -0.02em;
        }

        header p {
            margin: 8px 0 0;
            color: #555;
            max-width: 900px;
            line-height: 1.6;
        }

        .grid {
            display: grid;
            gap: 16px;
            padding: 20px;
            grid-template-columns: repeat(3, minmax(320px, 1fr));
            max-width: 1600px;
            margin: 0 auto 32px;
        }

        .card {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 32px rgba(0,0,0,0.08);
            border: 1px solid rgba(0,0,0,0.06);
            display: flex;
            flex-direction: column;
        }

        .card-header {
            padding: 14px 18px;
            font-weight: 700;
            background: #fafbfc;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }

        .card iframe {
            width: 100%;
            height: 420px;
            border: 1px solid #ccc;
            flex: 1 1 auto;
        }

        .single-map-card {
            align-items: stretch;
        }

        .slider-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 90%;
            margin: 14px auto 18px;
        }

        .slider-wrap label {
            width: 100%;
            text-align: center;
            font-weight: 600;
            color: #333;
        }

        .penetration-slider {
            width: 100%;
            max-width: 980px;
        }

        .shared-legend {
            margin: 20px auto 0;
            max-width: 920px;
            padding: 16px 26px;
            background: white;
            border-radius: 14px;
            box-shadow: 0 10px 24px rgba(0,0,0,0.08);
            border: 1px solid rgba(0,0,0,0.06);
            display: grid;
            gap: 12px;
        }

        .legend-title {
            font-weight: 700;
            color: #222;
            margin: 0;
        }

        .legend-bar {
            height: 18px;
            border-radius: 16px;
            background: linear-gradient(90deg, #FF0000 0%, #FF0000 18.0000%, #FFEA00 22.0000%, #FFEA00 28.0000%, #00CC00 32.0000%, #00CC00 99.9999%, #004D20 100.0000%, #004D20 100%);
            border: 1px solid rgba(0,0,0,0.08);
        }

        .legend-ticks {
            position: relative;
            height: 22px;
            margin-top: 4px;
        }

        .legend-tick {
            position: absolute;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
        }

        .legend-tick-line {
            width: 0;
            height: 8px;
            border-left: 2px solid #333;
        }

        .legend-tick-label {
            color: #444;
            font-size: 0.85rem;
            font-weight: 600;
            line-height: 1;
        }

        .legend-labels {
            display: flex;
            justify-content: space-between;
            color: #555;
            font-size: 0.95rem;
        }

        .legend-note {
            color: #555;
            font-size: 0.95rem;
            line-height: 1.45;
        }

        .footer {
            text-align: center;
            padding: 16px 20px 24px;
            color: #666;
            font-size: 0.95rem;
        }

        @media (max-width: 640px) {
            header { padding: 14px 16px; }
            .grid { padding: 14px; gap: 12px; }
            .slider-wrap { width: 94%; margin: 12px auto 16px; }
        }

        @media (max-width: 1180px) {
            .grid { grid-template-columns: repeat(2, minmax(300px, 1fr)); }
        }

        @media (max-width: 820px) {
            .grid { grid-template-columns: minmax(280px, 1fr); }
        }
    </style>
</head>
<body>
    <header>
        <h1>SCR Visualization: dynamic analysis</h1>
    </header>

    <div class="shared-legend">
        <p class="legend-title">SCR Legend</p>
        <div class="legend-bar"></div>
        <div class="legend-ticks">
            <div class="legend-tick" style="left: 0.0000%;"><span class="legend-tick-line"></span><span class="legend-tick-label">0.059</span></div>
            <div class="legend-tick" style="left: 20.0000%;"><span class="legend-tick-line"></span><span class="legend-tick-label">3</span></div>
            <div class="legend-tick" style="left: 30.0000%;"><span class="legend-tick-line"></span><span class="legend-tick-label">5</span></div>
            <div class="legend-tick" style="left: 100.0000%;"><span class="legend-tick-line"></span><span class="legend-tick-label">534.8</span></div>
        </div>
        <p class="legend-note">*Dark green indicates SCR value above 999 or no IBR located at bus</p>
    </div>

    <section class="grid">
        <article class="card single-map-card">
            <div class="card-header" id="map-card-title-1">dynamic SCR: 20% GFL IBRs</div>
            <iframe id="map-frame-1" src="dynamic_SCR_20.html" title="dynamic SCR: 20% GFL IBRs" loading="lazy" onload="hideFrameColorbar(this)"></iframe>
            <div class="slider-wrap">
                <label for="penetration-slider-1">Penetration Level: <span id="penetration-value-1">20%</span></label>
                <input id="penetration-slider-1" class="penetration-slider" type="range" min="0" max="7" step="1" value="0" />
            </div>
        </article>

        <article class="card single-map-card">
            <div class="card-header" id="map-card-title-2">dynamic SCR: 52% GFL IBRs</div>
            <iframe id="map-frame-2" src="dynamic_SCR_52.html" title="dynamic SCR: 52% GFL IBRs" loading="lazy" onload="hideFrameColorbar(this)"></iframe>
            <div class="slider-wrap">
                <label for="penetration-slider-2">Penetration Level: <span id="penetration-value-2">52%</span></label>
                <input id="penetration-slider-2" class="penetration-slider" type="range" min="0" max="7" step="1" value="3" />
            </div>
        </article>

        <article class="card single-map-card">
            <div class="card-header" id="map-card-title-3">dynamic SCR: 91% GFL IBRs</div>
            <iframe id="map-frame-3" src="dynamic_SCR_91.html" title="dynamic SCR: 91% GFL IBRs" loading="lazy" onload="hideFrameColorbar(this)"></iframe>
            <div class="slider-wrap">
                <label for="penetration-slider-3">Penetration Level: <span id="penetration-value-3">91%</span></label>
                <input id="penetration-slider-3" class="penetration-slider" type="range" min="0" max="7" step="1" value="7" />
            </div>
        </article>
    </section>

    <div class="footer">Keep all source map HTML files in the same directory as this viewer.</div>
    <script>
        const mapEntries = [{"title": "dynamic SCR: 20% GFL IBRs", "file_path": "dynamic_SCR_20.html", "penetration": "20"}, {"title": "dynamic SCR: 31% GFL IBRs", "file_path": "dynamic_SCR_31.html", "penetration": "31"}, {"title": "dynamic SCR: 42% GFL IBRs", "file_path": "dynamic_SCR_42.html", "penetration": "42"}, {"title": "dynamic SCR: 52% GFL IBRs", "file_path": "dynamic_SCR_52.html", "penetration": "52"}, {"title": "dynamic SCR: 63% GFL IBRs", "file_path": "dynamic_SCR_63.html", "penetration": "63"}, {"title": "dynamic SCR: 73% GFL IBRs", "file_path": "dynamic_SCR_73.html", "penetration": "73"}, {"title": "dynamic SCR: 81% GFL IBRs", "file_path": "dynamic_SCR_81.html", "penetration": "81"}, {"title": "dynamic SCR: 91% GFL IBRs", "file_path": "dynamic_SCR_91.html", "penetration": "91"}];

        function updateMapCard(cardId, index) {
            const entry = mapEntries[index];
            if (!entry) return;

            const titleEl = document.getElementById(`map-card-title-${cardId}`);
            const penetrationEl = document.getElementById(`penetration-value-${cardId}`);
            const frame = document.getElementById(`map-frame-${cardId}`);

            if (!titleEl || !penetrationEl || !frame) return;

            titleEl.textContent = entry.title;
            penetrationEl.textContent = `${entry.penetration}%`;
            frame.title = entry.title;

            if (frame.getAttribute('src') !== entry.file_path) {
                frame.setAttribute('src', entry.file_path);
            } else {
                hideFrameColorbar(frame);
            }
        }

        function hideFrameColorbar(frame) {
            try {
                const doc = frame.contentDocument || frame.contentWindow.document;
                if (!doc) return;

                // Hide any Plotly colorbar containers and tighten the map frame.
                const colorbars = doc.querySelectorAll('[class*="colorbar"], .colorbar, .cbaxis, .cbaxis-title');
                colorbars.forEach(el => el.style.display = 'none');

                const titles = doc.querySelectorAll('g[aria-label="Colorbar"], .colorbar-title, .cbaxis-title');
                titles.forEach(el => el.style.display = 'none');
            } catch (error) {
                console.warn('Unable to hide embedded colorbar for', frame.src, error);
            }
        }

        function initializeMapCard(cardId) {
            const slider = document.getElementById(`penetration-slider-${cardId}`);
            if (!slider) return;

            slider.addEventListener('input', event => {
                updateMapCard(cardId, Number(event.target.value));
            });
            updateMapCard(cardId, Number(slider.value));
        }

        initializeMapCard(1);
        initializeMapCard(2);
        initializeMapCard(3);
    </script>
</body>
</html>
