<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ΔNormalized SCR (NSCR) Visualization (GFM - GFL): dynamic analysis</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f4f8;
            color: #222;
        }

        header {
            padding: 20px 28px;
            background: white;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        header h1 {
            margin: 0;
            font-size: 1.35rem;
            letter-spacing: -0.02em;
        }

        header p {
            margin: 8px 0 0;
            color: #555;
            max-width: 900px;
            line-height: 1.6;
        }

        .grid {
            display: grid;
            gap: 16px;
            padding: 20px;
            grid-template-columns: repeat(3, minmax(320px, 1fr));
            max-width: 1600px;
            margin: 0 auto 32px;
        }

        .card {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 32px rgba(0,0,0,0.08);
            border: 1px solid rgba(0,0,0,0.06);
            display: flex;
            flex-direction: column;
        }

        .card-header {
            padding: 14px 18px;
            font-weight: 700;
            background: #fafbfc;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }

        .card iframe {
            width: 100%;
            height: 420px;
            border: 1px solid #ccc;
            flex: 1 1 auto;
        }

        .single-map-card {
            align-items: stretch;
        }

        .slider-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 90%;
            margin: 14px auto 18px;
        }

        .slider-wrap label {
            width: 100%;
            text-align: center;
            font-weight: 600;
            color: #333;
        }

        .penetration-slider {
            width: 100%;
            max-width: 980px;
        }

        .shared-legend {
            margin: 20px auto 0;
            max-width: 920px;
            padding: 16px 26px;
            background: white;
            border-radius: 14px;
            box-shadow: 0 10px 24px rgba(0,0,0,0.08);
            border: 1px solid rgba(0,0,0,0.06);
            display: grid;
            gap: 12px;
        }

        .legend-title {
            font-weight: 700;
            color: #222;
            margin: 0;
        }

        .legend-bar {
            height: 18px;
            border-radius: 16px;
            background: linear-gradient(90deg, #FFEA00 0%, #FFEA00 4.0000%, #00CC00 8.0000%, #00CC00 100%);
            border: 1px solid rgba(0,0,0,0.08);
        }

        .legend-ticks {
            position: relative;
            height: 22px;
            margin-top: 4px;
        }

        .legend-tick {
            position: absolute;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
        }

        .legend-tick-line {
            width: 0;
            height: 8px;
            border-left: 2px solid #333;
        }

        .legend-tick-label {
            color: #444;
            font-size: 0.85rem;
            font-weight: 600;
            line-height: 1;
        }

        .legend-labels {
            display: flex;
            justify-content: space-between;
            color: #555;
            font-size: 0.95rem;
        }

        .legend-note {
            color: #555;
            font-size: 0.95rem;
            line-height: 1.45;
        }

        .footer {
            text-align: center;
            padding: 16px 20px 24px;
            color: #666;
            font-size: 0.95rem;
        }

        @media (max-width: 640px) {
            header { padding: 14px 16px; }
            .grid { padding: 14px; gap: 12px; }
            .slider-wrap { width: 94%; margin: 12px auto 16px; }
        }

        @media (max-width: 1180px) {
            .grid { grid-template-columns: repeat(2, minmax(300px, 1fr)); }
        }

        @media (max-width: 820px) {
            .grid { grid-template-columns: minmax(280px, 1fr); }
        }
    </style>
</head>
<body>
    <header>
        <h1>ΔNormalized SCR (NSCR) Visualization (GFM - GFL): dynamic analysis</h1>
    </header>

    <div class="shared-legend">
        <p class="legend-title">ΔNormalized SCR (NSCR) Legend</p>
        <div class="legend-bar"></div>
        <div class="legend-ticks">
            <div class="legend-tick" style="left: 0.0000%;"><span class="legend-tick-line"></span><span class="legend-tick-label">0.0</span></div>
            <div class="legend-tick" style="left: 100.0000%;"><span class="legend-tick-line"></span><span class="legend-tick-label">71.67</span></div>
        </div>
        <p class="legend-note">*Yellow indicates no change in Normalized SCR (NSCR) from GFL to GFM</p>
    </div>

    <section class="grid">
        <article class="card single-map-card">
            <div class="card-header">dynamic NSCR: 20% IBRs</div>
            <iframe src="dynamic_NSCR_20.html" title="dynamic NSCR: 20% IBRs" loading="lazy" onload="hideFrameColorbar(this)"></iframe>
        </article>
    </section>

    <div class="footer">Keep all source map HTML files in the same directory as this viewer.</div>
    <script>
        const mapEntries = [{"title": "dynamic NSCR: 20% IBRs", "file_path": "dynamic_NSCR_20.html", "penetration": "20"}];

        function updateMapCard(cardId, index) {
            const entry = mapEntries[index];
            if (!entry) return;

            const titleEl = document.getElementById(`map-card-title-${cardId}`);
            const penetrationEl = document.getElementById(`penetration-value-${cardId}`);
            const frame = document.getElementById(`map-frame-${cardId}`);

            if (!titleEl || !penetrationEl || !frame) return;

            titleEl.textContent = entry.title;
            penetrationEl.textContent = `${entry.penetration}%`;
            frame.title = entry.title;

            if (frame.getAttribute('src') !== entry.file_path) {
                frame.setAttribute('src', entry.file_path);
            } else {
                hideFrameColorbar(frame);
            }
        }

        function hideFrameColorbar(frame) {
            try {
                const doc = frame.contentDocument || frame.contentWindow.document;
                if (!doc) return;

                // Hide any Plotly colorbar containers and tighten the map frame.
                const colorbars = doc.querySelectorAll('[class*="colorbar"], .colorbar, .cbaxis, .cbaxis-title');
                colorbars.forEach(el => el.style.display = 'none');

                const titles = doc.querySelectorAll('g[aria-label="Colorbar"], .colorbar-title, .cbaxis-title');
                titles.forEach(el => el.style.display = 'none');
            } catch (error) {
                console.warn('Unable to hide embedded colorbar for', frame.src, error);
            }
        }

        function initializeMapCard(cardId) {
            const slider = document.getElementById(`penetration-slider-${cardId}`);
            if (!slider) return;

            slider.addEventListener('input', event => {
                updateMapCard(cardId, Number(event.target.value));
            });
            updateMapCard(cardId, Number(slider.value));
        }


    </script>
</body>
</html>
